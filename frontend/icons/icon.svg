<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Isometric 3D Box / Inventory Symbol -->
  <g transform="translate(256, 210) scale(1.15)">
    <!-- Top Face -->
    <path d="M0 -90 L95 -35 L0 20 L-95 -35 Z" fill="#60a5fa" opacity="0.9" />
    <!-- Left Face -->
    <path d="M-95 -35 L0 20 L0 125 L-95 70 Z" fill="#2563eb" />
    <!-- Right Face -->
    <path d="M0 20 L95 -35 L95 70 L0 125 Z" fill="#1d4ed8" />
    <!-- Box Flap / Seam details -->
    <path d="M0 -90 L0 20" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-47.5 -7.5 L47.5 -7.5" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- RECON Badge Text -->
  <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">RECON ERP</text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#93c5fd" letter-spacing="2" text-anchor="middle">INVENTORY SYSTEM</text>
</svg>
