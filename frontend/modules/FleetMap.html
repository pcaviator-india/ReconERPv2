<div class="container-fluid py-3" id="fleetMapModule">

  <!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div>
      <h3 class="mb-0"><i class="bi bi-map text-primary me-2"></i><span class="i18n-label" data-i18n="fleet_map_title">Fleet Tracking Map</span></h3>
      <small class="text-muted" data-i18n="fleet_map_subtitle">Live view of all active voyages</small>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <span class="badge bg-light text-dark border px-2 py-1 small">
        <i class="bi bi-broadcast text-success me-1"></i>
        <span id="fleetLiveIndicator">Auto-refresh (30s)</span>
      </span>
      <button class="btn btn-outline-secondary shadow-sm" onclick="window.fleetMapRefresh()"
        title="Refresh" data-i18n="btn_refresh">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <div id="fleetMapAlert"></div>

  <!-- MAIN MAP & ACTIVE TRIPS LAYOUT -->
  <div class="row g-3">
    <!-- Map Canvas (8 cols on lg) -->
    <div class="col-lg-8">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small">
            <i class="bi bi-geo-alt-fill text-danger me-1"></i> Live Active Voyages Map
          </span>
          <span class="badge bg-primary rounded-pill" id="fleetActiveCountBadge">0 Active</span>
        </div>
        <div class="card-body p-0 position-relative">
          <div id="fleetMapCanvas" style="height: 600px; width: 100%; z-index: 1;"></div>
        </div>
      </div>
    </div>

    <!-- Active Trips List Sidebar (4 cols on lg) -->
    <div class="col-lg-4">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small">
            <i class="bi bi-truck text-success me-1"></i> <span data-i18n="fleet_active_trips">Active Trips</span>
          </span>
          <small class="text-muted" id="fleetLastUpdateText">Updated just now</small>
        </div>
        <div class="card-body p-2 flex-grow-1" id="fleetActiveTripsList" style="overflow-y: auto; max-height: 560px;">
          <div class="text-center text-muted py-5">
            <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
            <p class="small mb-0">Loading active trips...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
