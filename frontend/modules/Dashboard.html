        <button class="btn btn-sm rounded-pill btn-outline-primary" onclick="DashboardUI.toggleBreakdownView('table')" id="viewTableBtn">

<!-- Styles injected directly for self-containment -->
<style>
/* ============ GLASSMORPHISM & THEME VARIABLES ============ */
.dash-container {
  --glass-bg: rgba(255,255,255,0.7);
  --glass-border: rgba(255,255,255,0.3);
  --glass-shadow: 0 8px 32px rgba(31,38,135,0.08);
  --glass-blur: 12px;
  --card-bg: #ffffff;
  --text-primary: #212529;
  --text-muted: #6c757d;
  --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --kpi-gradient-1: linear-gradient(135deg, #0d6efd 0%, #0099ff 100%);
  --kpi-gradient-2: linear-gradient(135deg, #198754 0%, #00c853 100%);
  --kpi-gradient-3: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
  --kpi-gradient-4: linear-gradient(135deg, #0dcaf0 0%, #6610f2 100%);
  --transition-speed: 0.3s;
  --border-radius: 16px;
}

/* Dark Mode Variables */
.dash-container.dark-mode {
  --glass-bg: rgba(30, 32, 48, 0.8);
  --glass-border: rgba(255,255,255,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.3);
  --card-bg: #1e2030;
  --text-primary: #e4e6ef;
  --text-muted: #92929f;
}

.dash-container.dark-mode body,
.dash-container.dark-mode {
  background-color: #0d0e1a !important;
  color: #e4e6ef;
}

.dash-container.dark-mode .dash-title { color: #e4e6ef !important; }

/* ============ GLASSMORPHISM CARDS ============ */
.dash-glass-card {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
  border-radius: var(--border-radius) !important;
  transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
  overflow: hidden;
}

.dash-glass-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(31,38,135,0.15);
}

.dash-glass-card .card-header {
  background: transparent !important;
  border-bottom: 1px solid rgba(128,128,128,0.1);
  padding: 1rem 1.25rem 0.6rem;
  font-size: 0.9rem;
}

.dash-glass-card .card-body {
  padding: 1rem 1.25rem;
}

/* ============ DASHBOARD HEADER CARD ============ */
.dash-header-card {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--border-radius);
  padding: 1.25rem;
}

.dash-title {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 1.5rem;
}

/* ============ LIVE BADGE ============ */
.live-badge {
  font-size: 0.7rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.live-dot {
  width: 8px;
  height: 8px;
  background: #0d6efd;
  border-radius: 50%;
  display: inline-block;
  animation: livePulse 1.5s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ============ KPI CARDS ============ */
.kpi-card {
  border-radius: var(--border-radius) !important;
  border: none !important;
  cursor: pointer;
  transition: all var(--transition-speed) ease;
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  transition: all 0.5s ease;
}

.kpi-card:hover::before {
  transform: scale(3);
}

.kpi-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15) !important;
}

.kpi-card .kpi-icon {
  font-size: 2rem;
  opacity: 0.2;
  position: absolute;
  right: 1rem;
  bottom: 1rem;
}

.kpi-card .kpi-value {
  font-size: 2rem;
  font-weight: 800;
  line-height: 1.1;
}

.kpi-card .kpi-label {
  font-size: 0.8rem;
  opacity: 0.85;
  margin-bottom: 0;
}

.kpi-compare-badge {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

/* ============ AGING CARDS ============ */
.aging-card {
  border-radius: var(--border-radius) !important;
  border: none !important;
  transition: all var(--transition-speed) ease;
}

.aging-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.1) !important;
}

/* ============ FILTER BAR ============ */
.dash-filter-bar {
  padding: 0.5rem 0;
  border-top: 1px solid rgba(128,128,128,0.1);
}

.dash-filter-bar select,
.dash-filter-bar input {
  font-size: 0.8rem;
  border-radius: 10px !important;
}

/* ============ TIMELINE ============ */
.timeline-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(128,128,128,0.06);
  cursor: pointer;
  transition: background var(--transition-speed) ease;
  border-radius: 8px;
  padding-left: 8px;
  padding-right: 8px;
}

.timeline-item:hover {
  background: rgba(13,110,253,0.04);
}

.timeline-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
  position: relative;
}

.timeline-dot::after {
  content: '';
  position: absolute;
  top: 14px;
  left: 4px;
  width: 2px;
  height: calc(100% + 10px);
  background: rgba(13,110,253,0.1);
}

.timeline-item:last-child .timeline-dot::after {
  display: none;
}

.timeline-content {
  flex-grow: 1;
  min-width: 0;
}

.timeline-time {
  font-size: 0.65rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ============ STOCK HEALTH GAUGE ============ */
.stock-gauge-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stock-gauge-value {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
  line-height: 1;
}

.stock-gauge-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  font-weight: 500;
}

.health-stat-item {
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(128,128,128,0.05);
  transition: background var(--transition-speed) ease;
  cursor: default;
}

.health-stat-item:hover {
  background: rgba(128,128,128,0.1);
}

/* ============ BOTTLENECK ITEMS ============ */
.bottleneck-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(128,128,128,0.06);
  transition: background var(--transition-speed) ease;
  cursor: pointer;
  border-radius: 8px;
}

.bottleneck-item:hover {
  background: rgba(255,193,7,0.08);
}

.bottleneck-bar {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, #ffc107, #ff9800);
  transition: width 0.6s ease;
}

/* ============ SUPPLIER CARDS ============ */
.supplier-card {
  border-radius: 12px !important;
  border: none !important;
  transition: all var(--transition-speed) ease;
  background: var(--glass-bg) !important;
  backdrop-filter: blur(8px);
  overflow: hidden;
}

.supplier-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.1) !important;
}

.supplier-heat-bar {
  height: 4px;
  border-radius: 2px;
  margin-top: 8px;
  transition: width 0.6s ease;
}

/* ============ STAGGER ENTRANCE ANIMATIONS ============ */
.stagger-item {
  opacity: 0;
  transform: translateY(20px);
  animation: staggerFadeIn 0.5s ease forwards;
}

.stagger-item:nth-child(1) { animation-delay: 0.05s; }
.stagger-item:nth-child(2) { animation-delay: 0.1s; }
.stagger-item:nth-child(3) { animation-delay: 0.15s; }
.stagger-item:nth-child(4) { animation-delay: 0.2s; }
.stagger-item:nth-child(5) { animation-delay: 0.25s; }
.stagger-item:nth-child(6) { animation-delay: 0.3s; }

@keyframes staggerFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate__slideDown {
  animation: slideDown 0.3s ease forwards;
}

/* ============ COUNTER ANIMATION ============ */
.count-up {
  display: inline-block;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 991.98px) {
  .dash-title { font-size: 1.2rem; }
  .kpi-card .kpi-value { font-size: 1.5rem; }
  .dash-header-card { padding: 1rem; }
}

@media (max-width: 767.98px) {
  .dash-glass-card { border-radius: 12px !important; }
  .stagger-item:nth-child(n) { animation-delay: 0.05s; }
  .kpi-card .kpi-value { font-size: 1.3rem; }
  .kpi-card .kpi-icon { font-size: 1.5rem; }
}

@media (max-width: 575.98px) {
  .dash-container { padding: 0 !important; }
  .dash-glass-card .card-body { padding: 0.75rem; }
  .dash-header-card { padding: 0.75rem; border-radius: 12px; }
}

/* ============ SCROLLBAR ============ */
#dash-timeline-container::-webkit-scrollbar {
  width: 4px;
}
#dash-timeline-container::-webkit-scrollbar-thumb {
  background: rgba(13,110,253,0.2);
  border-radius: 4px;
}
#dash-timeline-container::-webkit-scrollbar-track {
  background: transparent;
}

/* ============ BREAKDOWN TABLE ============ */
.breakdown-table-card {
  border-radius: 10px;
  transition: all var(--transition-speed) ease;
}

.breakdown-table-card:hover {
  background: rgba(13,110,253,0.03);
}

/* Progress bar in breakdown */
.dash-progress {
  height: 8px;
  border-radius: 4px;
  background: rgba(128,128,128,0.1);
  overflow: hidden;
}
.dash-progress-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s ease;
  background: var(--accent-gradient);
}

/* ============ DARK MODE OVERRIDES ============ */
.dash-container.dark-mode .dash-glass-card {
  background: rgba(30, 32, 48, 0.85) !important;
}

.dash-container.dark-mode select,
.dash-container.dark-mode input {
  background: rgba(255,255,255,0.05) !important;
  color: #e4e6ef !important;
  border-color: rgba(255,255,255,0.1) !important;
}

.dash-container.dark-mode option {
  background: #1e2030;
  color: #e4e6ef;
}

.dash-container.dark-mode .health-stat-item {
  background: rgba(255,255,255,0.05);
}

.dash-container.dark-mode .timeline-item:hover {
  background: rgba(255,255,255,0.03);
}

.dash-container.dark-mode .bottleneck-item {
  border-color: rgba(255,255,255,0.06);
}

.dash-container.dark-mode .btn-outline-secondary {
  border-color: rgba(255,255,255,0.2);
  color: #aaa;
}

  <script src="./DashboardJS.html"></script>
