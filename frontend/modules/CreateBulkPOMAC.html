<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<div class="container mt-3">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>Dynamics GP Bulk PO Compilation Logging</h4>
    <button class="btn btn-primary" onclick="openMacroWizard()">+ New Bulk PO Macro</button>
  </div>

  <div class="card mb-4">
    <div class="card-body p-0">
      <table class="table table-striped mb-0" id="history-log-table">
        <thead class="table-dark">
          <tr>
            <th>Date / Time</th>
            <th>Generated By</th>
            <th>PO Volume Count</th>
            <th>Output Format Config</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="history-log-tbody">
          <tr><td colspan="5" class="text-center text-muted p-3">Loading system transactions execution logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>


</div>
