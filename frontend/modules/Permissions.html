<!-- ================================================================
     Permissions.html — Role & Permissions Management Module
     Admin-only: configure which role can view/edit/approve each module
     ================================================================ -->
<div id="permissionsModule" class="container-fluid px-3 py-3">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2 text-primary"></i>Role Permissions</h4>
      <small class="text-muted">Control what each role can see and do in every module</small>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-secondary btn-sm" onclick="permAddRole()">
        <i class="bi bi-plus-circle me-1"></i>Add New Role
      </button>
      <button class="btn btn-outline-warning btn-sm" onclick="permResetDefaults()">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset to Defaults
      </button>
      <button class="btn btn-primary btn-sm" id="btnSavePerms" onclick="permSave()">
        <i class="bi bi-floppy me-1"></i>Save Changes
      </button>
    </div>
  </div>

  <!-- Alert area -->
  <div id="permAlert" class="d-none mb-3"></div>

  <!-- Role Tabs -->
  <ul class="nav nav-tabs mb-3" id="permRoleTabs" role="tablist"></ul>

  <!-- Legend -->
  <div class="d-flex gap-3 mb-3 flex-wrap">
    <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 py-2 px-3"><i class="bi bi-eye me-1"></i>View</span>
    <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 py-2 px-3"><i class="bi bi-pencil me-1"></i>Edit/Create</span>
    <span class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-25 py-2 px-3"><i class="bi bi-check2-circle me-1"></i>Approve</span>
    <span class="badge bg-secondary bg-opacity-25 text-secondary border border-secondary border-opacity-25 py-2 px-3"><i class="bi bi-geo-alt me-1"></i>Site Scope</span>
  </div>

  <!-- Matrix Table -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div id="permMatrixContainer" class="table-responsive">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p>Loading permissions...</p>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Add Role Modal -->
<div class="modal fade" id="permAddRoleModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Add New Role</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Role ID <small class="text-muted">(slug, no spaces)</small></label>
          <input type="text" id="newRoleId" class="form-control form-control-sm" placeholder="e.g. auditor" />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Display Name</label>
          <input type="text" id="newRoleName" class="form-control form-control-sm" placeholder="e.g. Auditor" />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Description</label>
          <input type="text" id="newRoleDesc" class="form-control form-control-sm" placeholder="Short description..." />
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Clone permissions from</label>
          <select id="newRoleCloneFrom" class="form-select form-select-sm">
            <option value="user">Site User (minimal)</option>
            <option value="office">Office / Store</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin (full)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="permCreateRole()">Create Role</button>
      </div>
    </div>
  </div>
</div>

<script>
  if (typeof window.initPermissionsModule === 'function') {
    window.initPermissionsModule();
  }
</script>
