<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 data-i18n="stock_dashboard">Stock Dashboard</h4>
    <div>
      <button class="btn btn-outline-primary me-2" onclick="StockModule.refresh()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn btn-success" onclick="StockModule.exportStock()">
        <i class="bi bi-file-earmark-excel"></i> Export Excel
      </button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-4" id="stockSummary">
    <!-- Populated by JS -->
  </div>

  <!-- Filters -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" id="stockSearch" class="form-control" placeholder="Search by Item ID, Name..." onkeyup="StockModule.filterStock()">
        </div>
        <div class="col-md-3">
          <select id="locationFilter" class="form-select" onchange="StockModule.filterStock()">
            <option value="">All Locations</option>
           
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Stock Table -->
  <div class="card shadow-sm">
    <div class="table-responsive" style="max-height: 70vh;">
      <table class="table table-hover align-middle" id="stockTable">
        <thead class="table-dark sticky-top">
          <tr>
            <th>CODIGO GEO</th>
            <th>NUMERO PRODUCTO</th>
            <th>DESC EN</th>
            <th>DESC ES</th>
            <th>TIPO UBI.</th>
            <th>UBICACION</th>
            <th>ESTANTE/UBI.</th>
            <th class="text-end">CANTIDAD</th>
            <th class="text-end">DISPONIBLE</th>
            <th>ULTIMO ACTUALIZADO</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
      </table>
    </div>
  </div>
</div>
