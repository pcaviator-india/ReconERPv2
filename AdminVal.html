<div class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <div>
        <h4 id="valTitle" class="fw-bold mb-0 text-primary">---</h4>
        <p id="valSubtitle" class="text-muted small mb-0" data-i18n="manage_settings">Manage validation list</p>
      </div>
      <div class="d-flex gap-2">
        <!-- ADDED REFRESH BUTTON -->
        <button id="btnRefreshCache" class="btn btn-outline-secondary" onclick="forceConfigRefresh()" data-i18n="btn_sync">
          <i class="bi bi-arrow-clockwise"></i> <span class="ms-2">Sync Cache</span>
        </button>
        <button class="btn btn-primary" onclick="openValModal()" data-i18n="btn_add_new">
          <i class="bi bi-plus-circle me-2"></i><span class="ms-1">Add New</span>
        </button>
      </div>
    </div>
    <div class="card-body">
      <!-- Filter Bar -->
      <div id="valFilterBar" class="row g-2 mb-3 align-items-end">
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="valSearchInput" class="form-control border-start-0 shadow-sm" placeholder="Search...">
          </div>
        </div>
        <div class="col-md-3" id="valFilterSiteWrap" style="display:none;">
          <select id="valFilterSite" class="form-select form-select-sm shadow-sm">
            <option value="">-- All Sites --</option>
          </select>
        </div>
        <div class="col-md-2" id="valFilterActiveWrap" style="display:none;">
          <select id="valFilterActive" class="form-select form-select-sm shadow-sm">
            <option value="">-- All Status --</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>
        <div class="col-md-3 text-end" id="valFilterCountWrap">
          <small class="text-muted" id="valFilterCount"></small>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead id="valTableHead" class="table-light"></thead>
          <tbody id="valTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
